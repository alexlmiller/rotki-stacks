name: Rotki Nightly Tests

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - tests
  workflow_dispatch:

permissions: { }

jobs:
  linux:
    uses: ./.github/workflows/task_backend_tests.yml
    if: ${{ github.repository == 'rotki/rotki' || github.event_name != 'schedule' }}
    with:
      os: ubuntu-22.04
      test_environment: nightly
      collect_coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  macos:
    uses: ./.github/workflows/task_backend_tests.yml
    if: ${{ always() && (github.repository == 'rotki/rotki' || github.event_name != 'schedule') }}
    needs: [ 'linux' ]
    with:
      os: macos-latest
      test_environment: nightly
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  windows:
    uses: ./.github/workflows/task_backend_tests.yml
    if: ${{ always() && (github.repository == 'rotki/rotki' || github.event_name != 'schedule') }}
    with:
      os: windows-latest
      test_environment: nightly
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  # DISABLED: e2e (end-to-end tests not needed for Docker-only fork)

  backend-coverage:
    name: 'Backend coverage upload'
    if: ${{ always() && (github.repository == 'rotki/rotki' || github.event_name != 'schedule') }}
    needs: [ 'linux' ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@v2
        with:
          env_file: .github/.env.ci

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --group lint --group ci

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-ubuntu-22.04-*
          merge-multiple: true
          path: coverage_artifacts

      - name: Combine coverage
        run: |
          uv run coverage combine coverage_artifacts/.coverage.*
          uv run coverage xml -o coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          flags: backend-nightly
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # DISABLED: unittest-frontend (frontend unit tests not needed for Docker-only fork)

  # DISABLED: verify-link (external link verification not needed for Docker-only fork)

  # DISABLED: notify (Discord webhook notifications not configured for fork)
