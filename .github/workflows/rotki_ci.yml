name: Rotki CI

on:
  pull_request:
    branches:
      - master
      - develop
      - bugfixes
      - feature/**
  push:
    branches:
      - master
      - develop
      - bugfixes
      - feature/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  check-changes:
    name: 'Required job check'
    runs-on: ubuntu-latest
    outputs:
      backend_tasks: ${{ steps.checker.outputs.backend_tasks }}
      colibri_tasks: ${{ steps.checker.outputs.colibri_tasks }}
      frontend_tasks: ${{ steps.checker.outputs.frontend_tasks }}
      e2e_tasks: ${{ steps.checker.outputs.e2e_tasks }}
      documentation_tasks: ${{ steps.checker.outputs.documentation_tasks }}
      test_environment: ${{ steps.checker.outputs.test_environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run check action
        uses: rotki/action-job-checker@v4
        id: checker
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          documentation_paths: |
            docs
          colibri_paths: |
            colibri
          backend_paths: |
            rotkehlchen
            pyproject.toml
            .github/workflows/task_backend_tests.yml
          frontend_paths: |
            frontend

  check-typos:
    name: 'Check Typos'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run typos checker
        uses: crate-ci/typos@master

  # DISABLED: code-analyze-frontend (frontend CodeQL security analysis not needed for Docker-only fork)

  # DISABLED: lint-frontend (frontend linting not needed for Docker-only fork)

  # DISABLED: unittest-frontend (frontend unit tests not needed for Docker-only fork)

  docs:
    name: 'Documentation build'
    needs: [ 'check-changes', 'check-typos' ]
    if: ${{ github.event_name != 'push' && needs.check-changes.outputs.documentation_tasks }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@v3
        with:
          env_file: .github/.env.ci

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build html docs
        run: cd docs && uv run make html

  code-analyze-backend:
    name: 'Code analyze backend'
    needs: [ 'check-changes', 'check-typos' ]
    permissions:
      actions: read
      contents: read
      security-events: write
    if: ${{ needs.check-changes.outputs.backend_tasks }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'python'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  lint-colibri:
    name: 'Colibri lint and test'
    needs: [ 'check-changes', 'check-typos' ]
    if: ${{ github.event_name != 'push' && needs.check-changes.outputs.colibri_tasks }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@clippy
        with:
          toolchain: 1.86.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: colibri

      - run: cargo check --workspace && cargo clippy --workspace
        working-directory: ./colibri
        env:
          RUSTFLAGS: -Dwarnings

      - run: cargo test
        working-directory: ./colibri
        env:
          RUSTFLAGS: -Dwarnings

  lint-backend:
    name: 'Backend lint'
    needs: [ 'check-changes', 'check-typos' ]
    if: ${{ github.event_name != 'push' && needs.check-changes.outputs.backend_tasks }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Load env
        uses: rotki/action-env@v3
        with:
          env_file: .github/.env.ci

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Cache find-duplicate-constants binary
        id: fdc-cache
        uses: actions/cache@v4
        with:
          path: tools/find-duplicate-constants/target/release/find-duplicate-constants
          key: ${{ runner.os }}-find-duplicate-constants-${{ hashFiles('tools/find-duplicate-constants/Cargo.lock', 'tools/find-duplicate-constants/Cargo.toml', 'tools/find-duplicate-constants/src/**') }}

      - name: Setup Rust
        if: steps.fdc-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.fdc-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: tools/find-duplicate-constants

      - name: Build find-duplicate-constants
        if: steps.fdc-cache.outputs.cache-hit != 'true'
        working-directory: ./tools/find-duplicate-constants
        run: cargo build --release

      - name: Install dependencies
        run: uv sync --group lint

      - name: Lint
        run: uv run make lint

  test-backend:
    if: ${{ github.event_name != 'push' && needs.check-changes.outputs.backend_tasks }}
    needs: [ 'lint-backend', 'check-changes' ]
    uses: ./.github/workflows/task_backend_tests.yml
    with:
      os: ubuntu-22.04
      test_environment: ${{needs.check-changes.outputs.test_environment}}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  # DISABLED: test-e2e (end-to-end tests not needed for Docker-only fork)

  done:
    name: 'Success check'
    if: ${{ always() }}
    needs: [ 'check-changes', 'docs', 'lint-colibri', 'lint-backend', 'test-backend' ]
    runs-on: ubuntu-latest
    steps:
      - name: Check if any task failed
        run: |
          data=($(echo "${RESULT}" | sed 's/[][,]//g'))
          for i in "${data[@]}"
          do
            if [[ $i == "failure" ]]; then
                echo "::error::At least one required task failed"
                exit 1;
            fi
          done
        env:
          RESULT: ${{ toJSON(needs.*.result) }}
